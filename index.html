<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SacPath – Mock App</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --bg: #faf6ee;
    --card: #ffffff;
    --ink: #1f2a37;
    --muted: #6b7280;
    --line: #e8e1d2;
    --gold: #d99a1e;
    --gold-soft: #fbf0d4;
    --green: #2f6f4f;
    --green-soft: #e3f1e9;
    --red: #b4402f;
    --red-soft: #fbe6e2;
    --blue: #2c5aa0;
    --blue-soft: #e4edf9;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; margin: 0; letter-spacing: -0.01em; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }

  .app { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  .side { background: var(--ink); color: #f5efe0; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--gold); color: var(--ink); display: grid; place-items: center; font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; }
  .brand h1 { font-size: 21px; color: #fff; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 0; background: transparent; color: #cfc8b6; text-align: left; font-weight: 500; width: 100%; }
  .nav:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .nav.on { background: var(--gold); color: var(--ink); font-weight: 700; }
  .nav .count { margin-left: auto; font-size: 12px; background: rgba(255,255,255,0.14); padding: 1px 8px; border-radius: 99px; }
  .nav.on .count { background: rgba(31,42,55,0.15); }
  .side-foot { margin-top: auto; font-size: 12px; color: #9f9884; padding: 8px; border-top: 1px solid rgba(255,255,255,0.1); }

  .main { padding: 28px 36px 60px; max-width: 1180px; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .top h2 { font-size: 30px; }
  .top p { margin: 4px 0 0; color: var(--muted); }
  .btn { border: 0; background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { background: #121a24; }
  .btn.gold { background: var(--gold); color: var(--ink); }
  .btn.gold:hover { background: #c78a16; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover { background: #fff; }
  .btn.small { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat .n { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 13px; }
  .stat.alert .n { color: var(--red); }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .search { flex: 1; min-width: 200px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .chip { border: 1px solid var(--line); background: #fff; padding: 7px 14px; border-radius: 99px; font-size: 13px; font-weight: 500; color: var(--ink); }
  .chip:hover { border-color: var(--gold); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 12px 16px; background: #fdfbf6; border-bottom: 1px solid var(--line); }
  td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #fffdf8; }
  .title { font-weight: 600; }
  .org { color: var(--muted); font-size: 13px; }

  .pill { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .pill.Internship { background: var(--blue-soft); color: var(--blue); }
  .pill.Scholarship { background: var(--gold-soft); color: #8a5d00; }
  .pill.Fellowship { background: var(--green-soft); color: var(--green); }
  .tag { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; margin-right: 4px; }
  .due { font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 8px; display: inline-block; white-space: nowrap; }
  .due.urgent { background: var(--red-soft); color: var(--red); }
  .due.soon { background: var(--gold-soft); color: #8a5d00; }
  .due.ok { background: var(--green-soft); color: var(--green); }
  .due.past { background: #eee; color: #777; }
  .status { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff; }

  .overlay { position: fixed; inset: 0; background: rgba(20,26,36,0.5); display: grid; place-items: center; padding: 20px; z-index: 50; }
  .modal { background: #fff; border-radius: 18px; width: min(680px, 100%); max-height: 92vh; overflow: auto; padding: 26px; box-shadow: 0 30px 80px rgba(0,0,0,0.3); }
  .modal h3 { font-size: 24px; margin-bottom: 4px; }
  .tabs { display: flex; gap: 6px; margin: 16px 0 12px; }
  .tab { border: 1px solid var(--line); background: #fff; padding: 7px 14px; border-radius: 8px; font-weight: 500; }
  .tab.on { background: var(--gold-soft); border-color: var(--gold); font-weight: 700; }
  textarea, .field { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: #fffdf9; }
  textarea { min-height: 130px; resize: vertical; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 34px; text-align: center; color: var(--muted); background: #fffdf9; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.end { justify-content: flex-end; margin-top: 18px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  label.f { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .banner { background: var(--blue-soft); color: var(--blue); border-radius: 10px; padding: 9px 12px; font-size: 13px; margin-bottom: 12px; }
  .ai-badge { display: inline-flex; gap: 6px; align-items: center; background: var(--green-soft); color: var(--green); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 99px; margin: 14px 0 4px; }
  .spinner { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .list { display: grid; gap: 12px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .item h4 { margin: 0 0 2px; font-size: 16px; }
  .timeline { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .tl { font-size: 12px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fdfbf6; }
  .tl.done { background: #eee; color: #888; text-decoration: line-through; }
  .tl.next { background: var(--gold-soft); border-color: var(--gold); font-weight: 700; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .person { display: flex; gap: 12px; align-items: flex-start; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; font-weight: 700; flex: none; }
  .match { background: var(--green-soft); border: 1px solid #b9dcc8; border-radius: 12px; padding: 14px; margin-top: 12px; }
  .email { background: #fffdf9; border: 1px solid var(--line); border-radius: 10px; padding: 14px; white-space: pre-wrap; font-size: 14px; margin-top: 10px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 12px; z-index: 99; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }


  .banner.ok { background: var(--green-soft); color: var(--green); }
  .link { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0 0 0 8px; }
  .mbadge { display: inline-block; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 99px; }
  .mbadge.high { background: var(--green-soft); color: var(--green); }
  .mbadge.mid { background: var(--gold-soft); color: #8a5d00; }
  .mbadge.low { background: #eee; color: #777; }
  .why { font-size: 12px; color: var(--green); margin-top: 2px; }
  .skills { display: flex; flex-wrap: wrap; gap: 6px; }
  .skill { display: inline-flex; align-items: center; gap: 4px; background: var(--gold-soft); border: 1px solid #ecd49a; border-radius: 99px; padding: 3px 4px 3px 11px; font-size: 13px; font-weight: 500; }
  .skill button { border: 0; background: transparent; width: 20px; height: 20px; border-radius: 50%; line-height: 1; color: #8a5d00; }
  .skill button:hover { background: rgba(0,0,0,0.08); }
  .zip { width: 120px; }
  .chip:disabled { opacity: 0.45; cursor: not-allowed; }
  .item .two { display: block; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 12px; }
    .brand { padding: 0 8px; }
    .side-foot { display: none; }
    .main { padding: 20px 16px 60px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .two, .grid2 { grid-template-columns: 1fr; }
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }
    tr { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    td { border: 0; padding: 4px 0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect } = React;

/* ---------- helpers ---------- */
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const iso = (d) => d.toISOString().slice(0, 10);
const plus = (n) => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return iso(d); };
const daysLeft = (s) => Math.round((new Date(s + "T00:00:00") - TODAY) / 86400000);
const fmt = (s) => new Date(s + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const REMINDERS = [["1 month", 30], ["2 weeks", 14], ["1 week", 7], ["3 days", 3], ["Day of", 0]];
const dueClass = (n) => (n < 0 ? "past" : n <= 7 ? "urgent" : n <= 21 ? "soon" : "ok");
const dueText = (n) => (n < 0 ? "Closed" : n === 0 ? "Due today" : n === 1 ? "1 day left" : n + " days left");

/* ---------- seed data (mock) ---------- */
const SEED = [
  { id: 1, title: "Cybersecurity Intern, Summer 2027", org: "Sacramento Municipal Utility District", type: "Internship", deadline: plus(5), location: "Sacramento, CA", zip: "95817", remote: false, near: true, major: "Computer Science", kw: ["cybersecurity", "python", "networking", "linux", "it support"], status: "Applying", source: "Company site", link: "#" },
  { id: 2, title: "MESA Transfer Scholarship", org: "CRC MESA Program", type: "Scholarship", deadline: plus(12), location: "Cosumnes River College", zip: "95823", remote: false, near: true, major: "STEM", kw: ["leadership", "stem", "community", "mathematics"], status: "Saved", source: "CRC Website", link: "#" },
  { id: 3, title: "Software Engineering Fellowship", org: "Hack the Capital", type: "Fellowship", deadline: plus(26), location: "Remote", remote: true, near: false, major: "Computer Science", kw: ["python", "javascript", "react", "git", "teamwork"], status: "Saved", source: "LinkedIn", link: "#" },
  { id: 4, title: "TRIO Student Support Scholarship", org: "CRC TRIO", type: "Scholarship", deadline: plus(2), location: "Cosumnes River College", zip: "95823", remote: false, near: true, major: "Any", kw: ["leadership", "community", "writing"], status: "Submitted", source: "CRC Website", link: "#" },
  { id: 5, title: "Data Analyst Intern", org: "Kaiser Permanente", type: "Internship", deadline: plus(44), location: "Rancho Cordova, CA", zip: "95670", remote: false, near: true, major: "Data Science", kw: ["sql", "excel", "python", "data analysis", "statistics"], status: "Saved", source: "Indeed", link: "#" },
  { id: 6, title: "UC Davis Transfer Pathway Fellowship", org: "UC Davis", type: "Fellowship", deadline: plus(19), location: "Davis, CA", zip: "95616", remote: false, near: false, major: "Any", kw: ["leadership", "research", "community", "teamwork"], status: "Saved", source: "School Program", link: "#" },
];
const PEOPLE = [
  { id: 1, name: "Prof. Alvarez", role: "CS Instructor, CRC", note: "Had me for CIS 20 and CIS 54. Supervised my capstone project. Knows my coding and teamwork.", tags: ["Computer Science", "STEM", "Data Science"] },
  { id: 2, name: "Ms. Thompson", role: "MESA Program Advisor", note: "Has worked with me for 2 years in MESA. Can speak to leadership and community involvement.", tags: ["Scholarship", "STEM", "Any"] },
  { id: 3, name: "Dana Reyes", role: "Supervisor, campus IT help desk", note: "My manager on the student IT job. Can speak to reliability and customer service.", tags: ["Internship", "Computer Science"] },
];
const SAMPLES = [
  { title: "Network Engineering Intern", org: "Intel Folsom", type: "Internship", deadline: plus(30), location: "Folsom, CA", zip: "95630", remote: false, near: true, major: "Computer Science", kw: ["networking", "linux", "python", "it support"] },
  { title: "Dream Big Transfer Scholarship", org: "Sacramento Region Community Foundation", type: "Scholarship", deadline: plus(21), location: "Remote", remote: true, near: false, major: "Any", kw: ["leadership", "community", "writing"] },
];
const SAMPLE_TEXT = "Dream Big Transfer Scholarship – Sacramento Region Community Foundation. Open to California community college students planning to transfer. Award: $2,500. Apply online by " + fmt(plus(21)) + ". Requires a 500-word essay and one letter of recommendation.";

/* ---------- small components ---------- */
function Toast({ msg }) { return msg ? <div className="toast">{msg}</div> : null; }

function SmartAdd({ onClose, onSave }) {
  const [mode, setMode] = useState("text");
  const [input, setInput] = useState("");
  const [file, setFile] = useState("");
  const [phase, setPhase] = useState("input"); // input | loading | review
  const [draft, setDraft] = useState(null);

  const extract = () => {
    setPhase("loading");
    setTimeout(() => {
      const t = (input + file).toLowerCase();
      let base = /scholar|award|dream big/.test(t) ? SAMPLES[1] : SAMPLES[0];
      setDraft({ ...base, source: mode === "link" ? "Link" : mode === "shot" ? "Screenshot" : "Pasted text", link: mode === "link" ? input : "#" });
      setPhase("review");
    }, 1500);
  };
  const set = (k, v) => setDraft((d) => ({ ...d, [k]: v }));

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h3>Smart Add</h3>
        <div className="org">Paste anything. Claude pulls out the details.</div>

        {phase !== "review" && (
          <>
            <div className="tabs">
              {[["text", "Paste text"], ["link", "Link"], ["shot", "Screenshot"]].map(([k, l]) => (
                <button key={k} className={"tab" + (mode === k ? " on" : "")} onClick={() => setMode(k)}>{l}</button>
              ))}
            </div>
            {mode === "text" && <textarea placeholder="Paste the posting text here…" value={input} onChange={(e) => setInput(e.target.value)} />}
            {mode === "link" && <input className="field" placeholder="https://… (LinkedIn, Indeed, CRC, MESA, TRIO…)" value={input} onChange={(e) => setInput(e.target.value)} />}
            {mode === "shot" && (
              <label className="drop" style={{ display: "block", cursor: "pointer" }}>
                {file ? "📎 " + file : "Drop a screenshot here or click to upload"}
                <input type="file" accept="image/*" hidden onChange={(e) => setFile(e.target.files[0]?.name || "")} />
              </label>
            )}
            <div className="row end">
              {mode === "text" && <button className="btn ghost" onClick={() => setInput(SAMPLE_TEXT)}>Try a sample</button>}
              <button className="btn ghost" onClick={onClose}>Cancel</button>
              <button className="btn gold" disabled={phase === "loading" || !(input || file)} onClick={extract}>
                {phase === "loading" ? <><span className="spinner" /> Claude is reading…</> : "✨ Extract with Claude"}
              </button>
            </div>
          </>
        )}

        {phase === "review" && draft && (
          <>
            <div className="ai-badge">✨ Filled in by Claude. Review and edit before saving.</div>
            <div className="grid2">
              <div style={{ gridColumn: "1 / -1" }}><label className="f">Title</label><input className="field" value={draft.title} onChange={(e) => set("title", e.target.value)} /></div>
              <div><label className="f">Organization</label><input className="field" value={draft.org} onChange={(e) => set("org", e.target.value)} /></div>
              <div><label className="f">Type</label>
                <select className="field" value={draft.type} onChange={(e) => set("type", e.target.value)}>
                  <option>Internship</option><option>Scholarship</option><option>Fellowship</option>
                </select></div>
              <div><label className="f">Deadline</label><input type="date" className="field" value={draft.deadline} onChange={(e) => set("deadline", e.target.value)} /></div>
              <div><label className="f">Location</label><input className="field" value={draft.location} onChange={(e) => set("location", e.target.value)} /></div>
              <div><label className="f">Major / field</label><input className="field" value={draft.major} onChange={(e) => set("major", e.target.value)} /></div>
              <div><label className="f">Work style</label>
                <select className="field" value={draft.remote ? "remote" : "onsite"} onChange={(e) => set("remote", e.target.value === "remote")}>
                  <option value="onsite">In person</option><option value="remote">Remote</option>
                </select></div>
            </div>
            <div className="org" style={{ marginTop: 12 }}>
              Reminders will be set for: {REMINDERS.map(([l]) => l).join(" · ")}
            </div>
            <div className="row end">
              <button className="btn ghost" onClick={() => setPhase("input")}>Back</button>
              <button className="btn gold" onClick={() => onSave(draft)}>Save to tracker</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ---------- zip code filter (mock lookup; a real app would use a geocoding API) ---------- */
const ZIPS = {
  "95823": [38.4715, -121.4400], "95817": [38.5500, -121.4580], "95814": [38.5816, -121.4944], "95811": [38.5900, -121.4800],
  "95825": [38.5900, -121.4100], "95826": [38.5530, -121.3800], "95828": [38.4800, -121.4040], "95670": [38.5900, -121.2700],
  "95616": [38.5440, -121.7400], "95630": [38.6780, -121.1760], "95758": [38.4190, -121.4430], "95624": [38.4150, -121.3700],
  "95864": [38.5800, -121.3800], "95819": [38.5700, -121.4500], "95820": [38.5330, -121.4400], "95833": [38.6200, -121.5000],
};
function zipDist(zip, opp) {
  const a = ZIPS[zip], b = opp.zip && ZIPS[opp.zip];
  if (!a || !b || opp.remote) return null;
  const R = 3958.8, rad = (x) => (x * Math.PI) / 180;
  const dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}

/* ---------- resume + matching ---------- */
const SKILL_MAP = {
  "python": ["python"], "javascript": ["javascript", " js "], "react": ["react"], "java": [" java ", "java,"],
  "html": ["html", "css"], "c++": ["c++"], "sql": ["sql", "database"], "excel": ["excel", "spreadsheet"],
  "linux": ["linux", "unix"], "networking": ["network", "cisco", "tcp"], "cybersecurity": ["cyber", "security"],
  "git": ["github", " git "], "data analysis": ["data analysis", "analytics", "tableau"], "statistics": ["statistic"],
  "it support": ["help desk", "it support", "tech support", "troubleshoot"], "mathematics": ["calculus", "mathematics", "algebra"],
  "stem": ["stem", "mesa", "engineering"], "leadership": ["president", "captain", "led ", "leader", "officer"],
  "teamwork": ["team", "collaborat"], "community": ["volunteer", "community", "outreach", "mentor"],
  "writing": ["essay", "writing", "journal", "editor"], "research": ["research", "lab "],
};
const DEMO_PROFILE = { skills: ["python", "javascript", "git", "it support", "teamwork", "leadership", "community"], major: "Computer Science" };
const MAJORS = ["Computer Science", "Data Science", "Engineering", "Business", "Any"];
const STEM_MAJORS = ["Computer Science", "Data Science", "Engineering"];
function detectSkills(text) {
  const t = " " + text.toLowerCase() + " ";
  return Object.keys(SKILL_MAP).filter((s) => SKILL_MAP[s].some((k) => t.includes(k)));
}
function guessMajor(text) {
  const t = text.toLowerCase();
  if (/data science|statistic/.test(t)) return "Data Science";
  if (/computer science|programming|software|cis /.test(t)) return "Computer Science";
  if (/engineering/.test(t)) return "Engineering";
  if (/business|accounting/.test(t)) return "Business";
  return "Computer Science";
}
function matchOf(opp, profile) {
  if (!profile || !opp.kw) return null;
  const hits = opp.kw.filter((k) => profile.skills.includes(k));
  const majorOk = opp.major !== "Any" && (opp.major === profile.major || (opp.major === "STEM" && STEM_MAJORS.includes(profile.major)));
  const pct = Math.min(100, Math.round((hits.length / opp.kw.length) * 85) + (majorOk ? 15 : 0));
  return { pct, hits, majorOk };
}
const matchLevel = (p) => (p >= 70 ? "high" : p >= 45 ? "mid" : "low");

function ResumeTab({ profile, setProfile, toast, goTracker }) {
  const [text, setText] = useState("");
  const [file, setFile] = useState("");
  const [busy, setBusy] = useState(false);
  const [newSkill, setNewSkill] = useState("");

  const onFile = (f) => {
    if (!f) return;
    setFile(f.name);
    if (/\.(txt|md)$/i.test(f.name)) {
      const r = new FileReader();
      r.onload = () => setText(String(r.result));
      r.readAsText(f);
    }
  };
  const analyze = () => {
    setBusy(true);
    setTimeout(() => {
      const found = text.trim() ? detectSkills(text) : [];
      const skills = found.length ? found : DEMO_PROFILE.skills;
      setProfile({ fileName: file || "Pasted resume", skills, major: text.trim() ? guessMajor(text) : DEMO_PROFILE.major });
      setBusy(false);
      toast("✨ Resume analyzed. Opportunities now show match scores.");
    }, 1500);
  };
  const addSkill = () => {
    const s = newSkill.trim().toLowerCase();
    if (s && !profile.skills.includes(s)) setProfile({ ...profile, skills: [...profile.skills, s] });
    setNewSkill("");
  };

  return (
    <>
      <div className="top"><div><h2>Your resume</h2><p>Import it once. Claude reads your skills and scores every opportunity against them.</p></div></div>
      <div className="two">
        <div className="item">
          <b>1. Import</b>
          <label className="drop" style={{ display: "block", cursor: "pointer", marginTop: 10 }}>
            {file ? "📎 " + file : "Click to upload your resume (PDF, Word or .txt)"}
            <input type="file" accept=".pdf,.doc,.docx,.txt,.md" hidden onChange={(e) => onFile(e.target.files[0])} />
          </label>
          <div className="org" style={{ margin: "10px 0 6px" }}>Or paste the text:</div>
          <textarea placeholder="Paste your resume text here…" value={text} onChange={(e) => setText(e.target.value)} />
          <div className="org" style={{ marginTop: 8 }}>Mock note: only .txt/.md files and pasted text are read here. A PDF or Word file loads a demo profile. The real app sends the file to Claude.</div>
          <div className="row end">
            <button className="btn ghost" onClick={() => setText("Computer science student at Cosumnes River College. IT help desk technician: troubleshoot hardware and network issues. Python and JavaScript projects on GitHub. President of the coding club, volunteer tutor, MESA member. Team capstone project in SQL and React.")}>Try a sample</button>
            <button className="btn gold" disabled={busy || !(text.trim() || file)} onClick={analyze}>
              {busy ? <><span className="spinner" /> Claude is reading…</> : "✨ Analyze resume"}
            </button>
          </div>
        </div>

        <div className="item">
          <b>2. What Claude found</b>
          {!profile ? <div className="empty">Nothing yet. Import a resume to see your skills here.</div> : (
            <>
              <div className="org" style={{ margin: "4px 0 12px" }}>From {profile.fileName}. Edit anything that looks off.</div>
              <label className="f">Major / field</label>
              <select className="field" value={profile.major} onChange={(e) => setProfile({ ...profile, major: e.target.value })}>
                {MAJORS.map((m) => <option key={m}>{m}</option>)}
              </select>
              <label className="f" style={{ marginTop: 14 }}>Skills &amp; experience</label>
              <div className="skills">
                {profile.skills.map((s) => (
                  <span key={s} className="skill">{s}<button aria-label={"Remove " + s} onClick={() => setProfile({ ...profile, skills: profile.skills.filter((x) => x !== s) })}>×</button></span>
                ))}
              </div>
              <div className="row" style={{ marginTop: 10 }}>
                <input className="field" placeholder="Add a skill…" value={newSkill} onChange={(e) => setNewSkill(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addSkill()} />
                <button className="btn ghost small" onClick={addSkill}>Add</button>
              </div>
              <div className="row end"><button className="btn gold" onClick={goTracker}>See my matches →</button></div>
            </>
          )}
        </div>
      </div>
    </>
  );
}

function Tracker({ items, setItems, openAdd, profile, goResume }) {
  const [q, setQ] = useState("");
  const [type, setType] = useState("All");
  const [flags, setFlags] = useState({ remote: false, match: false });
  const [zip, setZip] = useState("");
  const [radius, setRadius] = useState("25");
  const zipOk = !!ZIPS[zip];
  const [statusF, setStatusF] = useState("All");
  const [win, setWin] = useState("all");
  const [sort, setSort] = useState("deadline");

  const shown = useMemo(() => items
    .map((i) => ({ ...i, m: matchOf(i, profile), dist: zipOk ? zipDist(zip, i) : null }))
    .filter((i) => type === "All" || i.type === type)
    .filter((i) => statusF === "All" || i.status === statusF)
    .filter((i) => win === "all" || (daysLeft(i.deadline) >= 0 && daysLeft(i.deadline) <= +win))
    .filter((i) => !flags.remote || i.remote)
    .filter((i) => !zipOk || i.remote || (i.dist != null && i.dist <= +radius))
    .filter((i) => !flags.match || (i.m && i.m.pct >= 50))
    .filter((i) => (i.title + i.org + i.major).toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => (sort === "match" && profile ? (b.m?.pct || 0) - (a.m?.pct || 0) : new Date(a.deadline) - new Date(b.deadline))),
  [items, q, type, flags, statusF, win, sort, profile, zip, radius, zipOk]);

  const upcoming = items.filter((i) => daysLeft(i.deadline) >= 0 && i.status !== "Submitted");
  const week = upcoming.filter((i) => daysLeft(i.deadline) <= 7).length;
  const setStatus = (id, s) => setItems(items.map((i) => (i.id === id ? { ...i, status: s } : i)));
  const clear = () => { setQ(""); setType("All"); setStatusF("All"); setWin("all"); setSort("deadline"); setFlags({ remote: false, match: false }); setZip(""); setRadius("25"); };

  return (
    <>
      <div className="top">
        <div><h2>Your opportunities</h2><p>Everything in one place. Filter by what fits you.</p></div>
        <button className="btn gold" onClick={openAdd}>＋ Smart Add</button>
      </div>
      <div className="stats">
        <div className="stat"><div className="n">{items.length}</div><div className="l">Saved</div></div>
        <div className="stat alert"><div className="n">{week}</div><div className="l">Due in 7 days</div></div>
        <div className="stat"><div className="n">{items.filter((i) => i.status === "Applying").length}</div><div className="l">In progress</div></div>
        <div className="stat"><div className="n">{items.filter((i) => i.status === "Submitted").length}</div><div className="l">Submitted</div></div>
      </div>

      {profile ? (
        <div className="banner ok">📄 Matching against <b>{profile.fileName}</b> · {profile.skills.length} skills · {profile.major} <button className="link" onClick={goResume}>Edit resume</button></div>
      ) : (
        <div className="banner">📄 Import your resume to see how well each opportunity fits you. <button className="link" onClick={goResume}>Import resume →</button></div>
      )}

      <div className="filters">
        <input className="search" placeholder="Search title, company, major…" value={q} onChange={(e) => setQ(e.target.value)} />
        {["All", "Internship", "Scholarship", "Fellowship"].map((t) => (
          <button key={t} className={"chip" + (type === t ? " on" : "")} onClick={() => setType(t)}>{t}</button>
        ))}
      </div>
      <div className="filters">
        <button className={"chip" + (flags.match ? " on" : "")} disabled={!profile} title={profile ? "" : "Import a resume first"} onClick={() => setFlags({ ...flags, match: !flags.match })}>⭐ Good fit for my resume</button>
        <button className={"chip" + (flags.remote ? " on" : "")} onClick={() => setFlags({ ...flags, remote: !flags.remote })}>🏠 Remote</button>
        <input className="status zip" inputMode="numeric" maxLength={5} placeholder="📍 ZIP code" value={zip} onChange={(e) => setZip(e.target.value.replace(/\D/g, ""))} />
        <select className="status" value={radius} onChange={(e) => setRadius(e.target.value)} disabled={!zipOk}>
          <option value="5">within 5 mi</option><option value="10">within 10 mi</option><option value="25">within 25 mi</option><option value="50">within 50 mi</option>
        </select>
        <select className="status" value={win} onChange={(e) => setWin(e.target.value)}>
          <option value="all">Any deadline</option><option value="7">Due in 7 days</option><option value="30">Due in 30 days</option>
        </select>
        <select className="status" value={statusF} onChange={(e) => setStatusF(e.target.value)}>
          <option>All</option><option>Saved</option><option>Applying</option><option>Submitted</option>
        </select>
        <select className="status" value={sort} onChange={(e) => setSort(e.target.value)}>
          <option value="deadline">Sort: soonest deadline</option>
          <option value="match" disabled={!profile}>Sort: best match</option>
        </select>
        <button className="chip" onClick={clear}>Clear</button>
      </div>

      {zip.length === 5 && !zipOk && <div className="banner">That ZIP isn't in the mock's small list. Try 95823, 95814, 95670, 95616 or 95630. The real app would look up any ZIP with a geocoding API.</div>}
      {zipOk && <div className="banner ok">📍 Showing opportunities within {radius} miles of {zip}, plus remote ones.</div>}
      <div className="card">
        {shown.length === 0 ? <div className="empty">No matches. Try clearing a filter.</div> : (
          <table>
            <thead><tr><th>Opportunity</th><th>Type</th><th>Where</th><th>Match</th><th>Deadline</th><th>Status</th></tr></thead>
            <tbody>
              {shown.map((i) => {
                const n = daysLeft(i.deadline);
                return (
                  <tr key={i.id}>
                    <td>
                      <div className="title">{i.title}</div>
                      <div className="org">{i.org} · via {i.source}</div>
                      {i.m && i.m.hits.length > 0 && <div className="why">Matches your: {i.m.hits.join(", ")}</div>}
                    </td>
                    <td><span className={"pill " + i.type}>{i.type}</span></td>
                    <td><span className="tag">{i.remote ? "Remote" : i.location}</span>{i.dist != null && <div className="org">{i.dist} mi away</div>}</td>
                    <td>{i.m ? <span className={"mbadge " + matchLevel(i.m.pct)}>{i.m.pct}%</span> : <span className="org">–</span>}</td>
                    <td><span className={"due " + dueClass(n)}>{dueText(n)}</span><div className="org">{fmt(i.deadline)}</div></td>
                    <td>
                      <select className="status" value={i.status} onChange={(e) => setStatus(i.id, e.target.value)}>
                        <option>Saved</option><option>Applying</option><option>Submitted</option>
                      </select>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </>
  );
}

function Reminders({ items, toast }) {
  const list = items.filter((i) => i.status !== "Submitted").sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
  return (
    <>
      <div className="top"><div><h2>Deadline reminders</h2><p>Five nudges per opportunity, sent to your email and calendar.</p></div></div>
      <div className="list">
        {list.map((i) => {
          const n = daysLeft(i.deadline);
          const nextIdx = REMINDERS.map(([, d]) => d).findIndex((d) => n >= d);
          return (
            <div className="item" key={i.id}>
              <div className="row" style={{ justifyContent: "space-between", alignItems: "flex-start" }}>
                <div><h4>{i.title}</h4><div className="org">{i.org} · due {fmt(i.deadline)}</div></div>
                <button className="btn ghost small" onClick={() => toast("📧 Test reminder sent for “" + i.title + "”")}>Send test reminder</button>
              </div>
              <div className="timeline">
                {REMINDERS.map(([label, d], idx) => {
                  const when = new Date(i.deadline + "T00:00:00"); when.setDate(when.getDate() - d);
                  const past = when < TODAY;
                  return <span key={label} className={"tl" + (past ? " done" : idx === nextIdx ? " next" : "")}>{label} · {iso(when).slice(5)}</span>;
                })}
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

function Recommenders({ items, toast }) {
  const open = items.filter((i) => i.status !== "Submitted");
  const [sel, setSel] = useState(open[0]?.id);
  const [draft, setDraft] = useState(false);
  const opp = items.find((i) => i.id === sel);
  const score = (p) => opp ? p.tags.filter((t) => t === opp.major || t === opp.type || t === "Any").length : 0;
  const best = opp ? [...PEOPLE].sort((a, b) => score(b) - score(a))[0] : null;
  const email = opp && best ? `Hi ${best.name},\n\nI hope you're doing well! I'm applying for the ${opp.title} at ${opp.org} (deadline ${fmt(opp.deadline)}), and I'd be grateful if you'd write a letter of recommendation. ${best.note.split(".")[0]}, so I thought you'd be a great fit to speak to my work.\n\nI can send my resume and the posting. Thank you so much!\n\n– Your name` : "";

  return (
    <>
      <div className="top"><div><h2>Letter of recommendation</h2><p>Claude picks the best person to ask. You approve before anything is sent.</p></div></div>
      <div className="two">
        <div>
          <div className="item">
            <label className="f">Pick an opportunity</label>
            <select className="field" value={sel} onChange={(e) => { setSel(+e.target.value); setDraft(false); }}>
              {open.map((i) => <option key={i.id} value={i.id}>{i.title}</option>)}
            </select>
            {best && (
              <div className="match">
                <div className="ai-badge" style={{ margin: "0 0 6px" }}>✨ Best match</div>
                <div className="person"><div className="avatar">{best.name[0]}</div><div><b>{best.name}</b><div className="org">{best.role}</div></div></div>
                <div style={{ marginTop: 8, fontSize: 14 }}>{best.note}</div>
                {!draft && <button className="btn gold small" style={{ marginTop: 12 }} onClick={() => setDraft(true)}>Draft request email</button>}
              </div>
            )}
            {draft && (
              <>
                <div className="email">{email}</div>
                <div className="row end">
                  <button className="btn ghost small" onClick={() => setDraft(false)}>Cancel</button>
                  <button className="btn gold small" onClick={() => { toast("✅ Request sent to " + best.name + " (mock)"); setDraft(false); }}>Yes, send request</button>
                </div>
              </>
            )}
          </div>
        </div>
        <div className="list">
          <b>Your recommenders</b>
          {PEOPLE.map((p) => (
            <div className="item" key={p.id}>
              <div className="person"><div className="avatar">{p.name[0]}</div>
                <div><b>{p.name}</b><div className="org">{p.role}</div><div style={{ fontSize: 13, marginTop: 6 }}>{p.note}</div></div></div>
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

function App() {
  const [tab, setTab] = useState("tracker");
  const [items, setItems] = useState(SEED);
  const [adding, setAdding] = useState(false);
  const [profile, setProfile] = useState(null);
  const [msg, setMsg] = useState("");
  const toast = (m) => { setMsg(m); setTimeout(() => setMsg(""), 2600); };
  const save = (d) => { setItems([{ ...d, id: Date.now(), status: "Saved" }, ...items]); setAdding(false); toast("Saved! 5 reminders scheduled."); setTab("tracker"); };
  const NAV = [["tracker", "📋", "Tracker", items.length], ["resume", "📄", "My resume", null], ["reminders", "⏰", "Reminders", null], ["recs", "✉️", "Recommenders", null]];

  return (
    <div className="app">
      <aside className="side">
        <div className="brand"><div className="brand-mark">S</div><h1>SacPath</h1></div>
        {NAV.map(([k, ic, l, c]) => (
          <button key={k} className={"nav" + (tab === k ? " on" : "")} onClick={() => setTab(k)}>
            <span>{ic}</span>{l}{c != null && <span className="count">{c}</span>}
          </button>
        ))}
        <div className="side-foot">No account or login needed. Mock prototype for CRC Hacks 2026 with sample data; Claude extraction is simulated.</div>
      </aside>
      <main className="main">
        {tab === "tracker" && <Tracker items={items} setItems={setItems} openAdd={() => setAdding(true)} profile={profile} goResume={() => setTab("resume")} />}
        {tab === "resume" && <ResumeTab profile={profile} setProfile={setProfile} toast={toast} goTracker={() => setTab("tracker")} />}
        {tab === "reminders" && <Reminders items={items} toast={toast} />}
        {tab === "recs" && <Recommenders items={items} toast={toast} />}
      </main>
      {adding && <SmartAdd onClose={() => setAdding(false)} onSave={save} />}
      <Toast msg={msg} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
