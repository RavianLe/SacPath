];
const PROFILE_SAMPLES = [
  { name: "Jamie Torres", role: "University Recruiter", company: "Intel Folsom" },
  { name: "Sam Okafor", role: "Engineering Manager", company: "Kaiser Permanente" },
];

function findCompany(companies, name) {
  const n = (name || "").toLowerCase().trim();
  if (!n) return null;
  return companies.find((c) => !c.archived && (c.name.toLowerCase() === n || c.keys.some((k) => n.includes(k)))) || null;
}
function oppsAt(company, items) {
  return items.filter((o) => !o.archived && company.keys.some((k) => (o.org + " " + o.title).toLowerCase().includes(k)));
}

function Affiliates({ items, contacts, setContacts, companies, setCompanies, docs, profile, drafts, onSaveDraft, toast }) {
  const blank = { name: "", role: "", companyId: "", newCompany: "", saveCompany: true, met: "", note: "", links: [] };
  const [adding, setAdding] = useState(false);
  const [f, setF] = useState(blank);
  const [q, setQ] = useState("");
  const [showArch, setShowArch] = useState(false);
  const [refOpen, setRefOpen] = useState(null);
  const [refInit, setRefInit] = useState(null);
  const [imode, setImode] = useState("link");
  const [iinput, setIinput] = useState("");
  const [ifile, setIfile] = useState("");
  const [busy, setBusy] = useState(false);
  const [imported, setImported] = useState(false);
  const active = items.filter((i) => !i.archived);
  const activeCos = companies.filter((c) => !c.archived);
  const opp = (id) => items.find((i) => i.id === id);
  const upd = (id, fn) => setContacts(contacts.map((c) => (c.id === id ? fn(c) : c)));
  const toggle = (id) => setF({ ...f, links: f.links.includes(id) ? f.links.filter((x) => x !== id) : [...f.links, id] });
  const reset = () => { setF(blank); setIinput(""); setIfile(""); setImported(false); setAdding(false); };

  const extract = () => {
    setBusy(true);
    setTimeout(() => {
      const seed = (iinput + ifile).split("").reduce((a, c) => a + c.charCodeAt(0), 0);
      const p = PROFILE_SAMPLES[seed % PROFILE_SAMPLES.length];
      const co = findCompany(companies, p.company);
      setF((prev) => ({ ...prev, name: p.name, role: p.role, companyId: co ? String(co.id) : "__new", newCompany: co ? "" : p.company, met: imode === "link" ? "Profile link" : "Profile screenshot" }));
      setImported(true); setBusy(false);
    }, 1400);
  };

  const save = () => {
    if (!f.name.trim()) return;
    let co = f.companyId && f.companyId !== "__new" ? companies.find((c) => String(c.id) === f.companyId) : null;
    const orgName = co ? co.name : f.newCompany.trim();
    let cid = co ? co.id : null;
    if (!co && orgName && f.saveCompany) {
      const nc = { id: Date.now() + 1, name: orgName, keys: [orgName.toLowerCase()], site: "", note: "" };
      setCompanies([nc, ...companies]); cid = nc.id;
    }
    setContacts([{ id: Date.now(), name: f.name.trim(), role: f.role, org: orgName, companyId: cid, met: f.met, note: f.note, links: f.links }, ...contacts]);
    toast("Saved " + f.name.trim());
    reset();
  };
  const saveCompanyFor = (c) => {
    const nc = { id: Date.now(), name: c.org, keys: [c.org.toLowerCase()], site: "", note: "" };
    setCompanies([nc, ...companies]);
    setContacts(contacts.map((x) => (x.org === c.org && !x.companyId ? { ...x, companyId: nc.id } : x)));
    toast("Saved " + c.org + " to your companies");
  };
  const shown = contacts.filter((c) => !!c.archived === showArch).filter((c) => (c.name + c.org + c.role).toLowerCase().includes(q.toLowerCase()));

  return (
    <>
      <div className="top">
        <div><h2>Affiliates</h2><p>People you've met, tied to a company and to the opportunities they can help with.</p></div>
        <button className="btn gold" onClick={() => (adding ? reset() : setAdding(true))}>{adding ? "Close" : "＋ Add person"}</button>
      </div>

      {adding && (
        <div className="item" style={{ marginBottom: 16 }}>
          <b>New affiliate</b>

          <div className="match" style={{ background: "var(--gold-soft)", borderColor: "#f3c58a" }}>
            <div className="ai-badge" style={{ margin: "0 0 8px" }}>✨ Auto-fill from a profile</div>
            <div className="tabs" style={{ margin: "0 0 10px" }}>
              <button className={"tab" + (imode === "link" ? " on" : "")} onClick={() => setImode("link")}>Paste a link</button>
              <button className={"tab" + (imode === "shot" ? " on" : "")} onClick={() => setImode("shot")}>Upload a screenshot</button>
            </div>
            {imode === "link"
              ? <input className="field" placeholder="https://… link to their profile" value={iinput} onChange={(e) => setIinput(e.target.value)} />
              : (
                <label className="drop" style={{ display: "block", cursor: "pointer", padding: 18 }}>
                  {ifile ? "📎 " + ifile : "Click to upload a screenshot of their profile"}
                  <input type="file" accept="image/*" hidden onChange={(e) => setIfile(e.target.files[0]?.name || "")} />
                </label>
              )}
            <div className="org" style={{ marginTop: 6 }}>Tip: screenshots work best for sites that need a login, like LinkedIn. Mock note: the extraction here is simulated.</div>
            <div className="row end" style={{ marginTop: 10 }}>
              <button className="btn gold small" disabled={busy || !(iinput || ifile)} onClick={extract}>{busy ? <><span className="spinner" /> Claude is reading…</> : "✨ Extract with Claude"}</button>
            </div>
            {imported && <div className="org" style={{ color: "var(--green)", fontWeight: 600 }}>Filled in below. Check it and edit anything that looks off.</div>}
          </div>

          <div className="grid2">
            <div><label className="f">Name</label><input className="field" value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} /></div>
            <div><label className="f">Role</label><input className="field" placeholder="e.g. Recruiter" value={f.role} onChange={(e) => setF({ ...f, role: e.target.value })} /></div>
            <div>
              <label className="f">Company</label>
              <select className="field" value={f.companyId} onChange={(e) => setF({ ...f, companyId: e.target.value })}>
                <option value="">Choose a saved company…</option>
                {activeCos.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                <option value="__new">＋ New company…</option>
              </select>
            </div>
            <div><label className="f">How you met</label><input className="field" placeholder="e.g. Career fair" value={f.met} onChange={(e) => setF({ ...f, met: e.target.value })} /></div>
            {f.companyId === "__new" && (
              <div style={{ gridColumn: "1 / -1" }}>
                <label className="f">New company name</label>
                <input className="field" value={f.newCompany} onChange={(e) => setF({ ...f, newCompany: e.target.value })} />
                <label className="checkrow" style={{ borderBottom: 0, paddingBottom: 0 }}><input type="checkbox" checked={f.saveCompany} onChange={() => setF({ ...f, saveCompany: !f.saveCompany })} /> <span>Save this company to my companies</span></label>
              </div>
            )}
            <div style={{ gridColumn: "1 / -1" }}><label className="f">Notes</label><input className="field" value={f.note} onChange={(e) => setF({ ...f, note: e.target.value })} /></div>
          </div>
          <label className="f" style={{ marginTop: 14 }}>Link to opportunities</label>
          <div className="skills">
            {active.map((i) => (
              <button key={i.id} className={"chip" + (f.links.includes(i.id) ? " on" : "")} onClick={() => toggle(i.id)}>{i.title}</button>
            ))}
          </div>
          <div className="row end"><button className="btn ghost" onClick={reset}>Cancel</button><button className="btn gold" disabled={!f.name.trim()} onClick={save}>Save person</button></div>
        </div>
      )}

      <div className="filters"><input className="search" placeholder="Search people, companies…" value={q} onChange={(e) => setQ(e.target.value)} /><button className={"chip" + (showArch ? " on" : "")} onClick={() => setShowArch(!showArch)}>🗄 Archived ({contacts.filter((c) => c.archived).length})</button></div>

      <div className="list">
        {shown.length === 0 && <div className="card"><div className="empty">{showArch ? "No one archived." : "No one found."}</div></div>}
        {shown.map((c) => {
          const free = active.filter((i) => !c.links.includes(i.id));
          const co = companies.find((x) => x.id === c.companyId);
          const suggested = co ? oppsAt(co, items).filter((o) => !c.links.includes(o.id)) : [];
          return (
            <div className="item" key={c.id}>
              <div className="person">
                <div className="avatar">{c.name[0]}</div>
                <div style={{ flex: 1 }}>
                  <b>{c.name}</b> <span className="org">{c.role}</span>
                  <div style={{ marginTop: 4 }}>
                    {c.org && <span className="tag">🏢 {c.org}</span>}
                    {c.org && !co && <button className="btn ghost small" style={{ padding: "2px 10px" }} onClick={() => saveCompanyFor(c)}>＋ Save company</button>}
                    {co && <span className="org">saved company</span>}
                  </div>
                  <div className="org" style={{ marginTop: 4 }}>Met: {c.met || "–"}{c.last ? " · Last reached out " + fmt(c.last) : ""}</div>
                  {c.note && <div style={{ fontSize: 14, marginTop: 6 }}>{c.note}</div>}
                  <div className="org" style={{ margin: "12px 0 6px", fontWeight: 600 }}>Linked opportunities</div>
                  <div className="skills">
                    {c.links.filter((id) => opp(id)).length === 0 && <span className="org">None yet.</span>}
                    {c.links.map((id) => {
                      const o = opp(id); if (!o) return null;
                      const n = daysLeft(o.deadline);
                      return (
                        <span key={id} className="skill">{o.title} · <span className={"due " + dueClass(n)} style={{ padding: "1px 7px", fontSize: 11 }}>{dueText(n)}</span>
                          <button aria-label="Unlink" onClick={() => upd(c.id, (x) => ({ ...x, links: x.links.filter((l) => l !== id) }))}>×</button></span>
                      );
                    })}
                  </div>
                  {suggested.length > 0 && (
                    <div style={{ marginTop: 10 }}>
                      <div className="org" style={{ marginBottom: 4 }}>Also at {co.name}:</div>
                      <div className="skills">
                        {suggested.map((o) => <button key={o.id} className="chip" onClick={() => upd(c.id, (x) => ({ ...x, links: [...x.links, o.id] }))}>＋ Link {o.title}</button>)}
                      </div>
                    </div>
                  )}
                  {drafts.filter((d) => d.refId === c.id && !d.archived).length > 0 && (
                    <div style={{ marginTop: 10 }}>
                      <div className="org" style={{ marginBottom: 4 }}>Your messages to {c.name.split(" ")[0]}: click one to edit</div>
                      <div className="skills">
                        {drafts.filter((d) => d.refId === c.id && !d.archived).map((d) => (
                          <button key={d.id} className="chip" onClick={() => { setRefInit(d); setRefOpen(c.id); }}>📝 {d.status === "sent" ? "Sent" : "Draft"} · {fmt(d.updated)}</button>
                        ))}
                      </div>
                    </div>
                  )}
                  <div className="row" style={{ marginTop: 12, flexWrap: "wrap" }}>
                    <select className="status" value="" onChange={(e) => e.target.value && upd(c.id, (x) => ({ ...x, links: [...x.links, +e.target.value] }))}>
                      <option value="">＋ Link an opportunity…</option>
                      {free.map((i) => <option key={i.id} value={i.id}>{i.title}</option>)}
                    </select>
                    <button className={"btn small " + (refOpen === c.id ? "gold" : "ghost")} onClick={() => { setRefInit(null); setRefOpen(refOpen === c.id && !refInit ? null : c.id); }}>✉️ Ask for referral</button>
                    <RowActions archived={!!c.archived} onArchive={() => { upd(c.id, (x) => ({ ...x, archived: true })); toast("Archived " + c.name); }} onRestore={() => upd(c.id, (x) => ({ ...x, archived: false }))} onDelete={() => { setContacts(contacts.filter((x) => x.id !== c.id)); toast("🗑️ Deleted " + c.name); }} />
                  </div>
                  {refOpen === c.id && <ReferralPanel key={refInit ? refInit.id : "new"} initial={refInit} onSaveDraft={onSaveDraft} c={c} items={items} docs={docs} profile={profile} toast={toast} onClose={() => setRefOpen(null)} onSent={() => { upd(c.id, (x) => ({ ...x, last: iso(TODAY) })); toast("✅ Message to " + c.name + " sent (mock)"); setRefOpen(null); }} />}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

function Companies({ items, contacts, setContacts, companies, setCompanies, toast }) {
  const [adding, setAdding] = useState(false);
  const [nf, setNf] = useState({ name: "", site: "", note: "" });
  const [q, setQ] = useState("");
  const [showArch, setShowArch] = useState(false);
  const upd = (id, v) => setCompanies(companies.map((c) => (c.id === id ? { ...c, ...v } : c)));
  const save = () => {
    const name = nf.name.trim(); if (!name) return;
    setCompanies([{ id: Date.now(), name, keys: [name.toLowerCase()], site: nf.site.trim(), note: nf.note }, ...companies]);
    toast("Saved " + name); setNf({ name: "", site: "", note: "" }); setAdding(false);
  };
  const remove = (c) => {
    setCompanies(companies.filter((x) => x.id !== c.id));
    setContacts(contacts.map((p) => (p.companyId === c.id ? { ...p, companyId: null } : p)));
    toast("🗑️ Deleted " + c.name);
  };
  const shown = companies.filter((c) => !!c.archived === showArch).filter((c) => c.name.toLowerCase().includes(q.toLowerCase()));

  return (
    <>
      <div className="top">
        <div><h2>Companies</h2><p>Places you want to work. See who you know there and what's open.</p></div>
        <button className="btn gold" onClick={() => setAdding(!adding)}>{adding ? "Close" : "＋ Save a company"}</button>
      </div>
      {adding && (
        <div className="item" style={{ marginBottom: 16 }}>
          <div className="grid2">
            <div><label className="f">Company name</label><input className="field" value={nf.name} onChange={(e) => setNf({ ...nf, name: e.target.value })} /></div>
            <div><label className="f">Website or careers page (optional)</label><input className="field" placeholder="https://…" value={nf.site} onChange={(e) => setNf({ ...nf, site: e.target.value })} /></div>
            <div style={{ gridColumn: "1 / -1" }}><label className="f">Notes</label><input className="field" value={nf.note} onChange={(e) => setNf({ ...nf, note: e.target.value })} /></div>
          </div>
          <div className="row end"><button className="btn gold" disabled={!nf.name.trim()} onClick={save}>Save company</button></div>
        </div>
      )}
      <div className="filters"><input className="search" placeholder="Search companies…" value={q} onChange={(e) => setQ(e.target.value)} /><button className={"chip" + (showArch ? " on" : "")} onClick={() => setShowArch(!showArch)}>🗄 Archived ({companies.filter((c) => c.archived).length})</button></div>
      <div className="list">
        {shown.length === 0 && <div className="card"><div className="empty">{showArch ? "No companies archived." : "No companies saved yet."}</div></div>}
        {shown.map((c) => {
          const people = contacts.filter((p) => p.companyId === c.id && !p.archived);
          const opps = oppsAt(c, items);
          return (
            <div className="item" key={c.id}>
              <div className="row" style={{ justifyContent: "space-between", alignItems: "flex-start" }}>
                <div><h4>🏢 {c.name}</h4>{c.site && <div className="org"><a href={c.site} target="_blank" rel="noreferrer">{c.site}</a></div>}{c.note && <div style={{ fontSize: 14, marginTop: 4 }}>{c.note}</div>}</div>
                <RowActions archived={!!c.archived} onArchive={() => { upd(c.id, { archived: true }); toast("Archived " + c.name); }} onRestore={() => upd(c.id, { archived: false })} onDelete={() => remove(c)} />
              </div>
              <div className="two" style={{ marginTop: 12 }}>
                <div>
                  <div className="org" style={{ fontWeight: 600, marginBottom: 6 }}>People you know</div>
                  <div className="skills">{people.length === 0 ? <span className="org">No one yet.</span> : people.map((p) => <span key={p.id} className="skill" style={{ paddingRight: 11 }}>{p.name}</span>)}</div>
                </div>
                <div>
                  <div className="org" style={{ fontWeight: 600, marginBottom: 6 }}>Opportunities</div>
                  <div className="skills">{opps.length === 0 ? <span className="org">None saved.</span> : opps.map((o) => { const n = daysLeft(o.deadline); return <span key={o.id} className="skill" style={{ paddingRight: 11 }}>{o.title} · <span className={"due " + dueClass(n)} style={{ padding: "1px 7px", fontSize: 11 }}>{dueText(n)}</span></span>; })}</div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

function Reminders({ items, toast }) {
  const list = items.filter((i) => i.status !== "Submitted" && !i.archived).sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
  return (
    <>
      <div className="top"><div><h2>Deadline reminders</h2><p>Five nudges per opportunity, sent to your email and calendar.</p></div></div>
      <div className="list">
        {list.length === 0 && <div className="card"><div className="empty">No reminders yet. Add an opportunity first.</div></div>}
        {list.map((i) => {
          const n = daysLeft(i.deadline);
          const nextIdx = REMINDERS.map(([, d]) => d).findIndex((d) => n >= d);
          return (
            <div className="item" key={i.id}>
              <div className="row" style={{ justifyContent: "space-between", alignItems: "flex-start" }}>
                <div><h4>{i.title}</h4><div className="org">{i.org} · due {fmt(i.deadline)}</div></div>
                <div className="rowact" style={{ marginTop: 0 }}>
                  {hasLink(i.link) && <a className="btn gold small" href={i.link} target="_blank" rel="noreferrer">Apply ↗</a>}
                  <button className="btn ghost small" onClick={() => toast("📧 Test reminder sent for “" + i.title + "”")}>Send test reminder</button>
                </div>
              </div>
              <div className="timeline">
                {REMINDERS.map(([label, d], idx) => {
                  const when = new Date(i.deadline + "T00:00:00"); when.setDate(when.getDate() - d);
                  const past = when < TODAY;
                  return <span key={label} className={"tl" + (past ? " done" : idx === nextIdx ? " next" : "")}>{label} · {iso(when).slice(5)}</span>;
                })}
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

function Recommenders({ items, people, setPeople, onSaveDraft, toast }) {
  const open = items.filter((i) => i.status !== "Submitted" && !i.archived);
  const [recBody, setRecBody] = useState("");
  const [recDraftId, setRecDraftId] = useState(null);
  const [showArch, setShowArch] = useState(false);
  const [adding, setAdding] = useState(false);
  const [nf, setNf] = useState({ name: "", role: "", note: "", tags: [] });
  const activePeople = people.filter((p) => !p.archived);
  const shownPeople = people.filter((p) => !!p.archived === showArch);
  const updP = (id, v) => setPeople(people.map((p) => (p.id === id ? { ...p, ...v } : p)));
  const [sel, setSel] = useState(open[0]?.id);
  const [draft, setDraft] = useState(false);
  const opp = open.find((i) => i.id === sel) || open[0];
  const score = (p) => opp ? p.tags.filter((t) => t === opp.major || t === opp.type || t === "Any").length : 0;
  const best = opp && activePeople.length ? [...activePeople].sort((a, b) => score(b) - score(a))[0] : null;
  const email = opp && best ? `Hi ${best.name},\n\nI hope you're doing well! I'm applying for the ${opp.title} at ${opp.org} (deadline ${fmt(opp.deadline)}), and I'd be grateful if you'd write a letter of recommendation. ${best.note.split(".")[0]}, so I thought you'd be a great fit to speak to my work.\n\nI can send my resume and the posting. Thank you so much!\n\n– Your name` : "";

  return (
    <>
      <div className="top"><div><h2>Letter of recommendation</h2><p>Claude picks the best person to ask. You approve before anything is sent.</p></div></div>
      <div className="two">
        <div>
          <div className="item">
            <label className="f">Pick an opportunity</label>
            <select className="field" value={opp ? opp.id : ""} onChange={(e) => { setSel(+e.target.value); setDraft(false); }}>
              {open.map((i) => <option key={i.id} value={i.id}>{i.title}</option>)}
            </select>
            {best && (
              <div className="match">
                <div className="ai-badge" style={{ margin: "0 0 6px" }}>✨ Best match</div>
                <div className="person"><div className="avatar">{best.name[0]}</div><div><b>{best.name}</b><div className="org">{best.role}</div></div></div>
                <div style={{ marginTop: 8, fontSize: 14 }}>{best.note}</div>
                {!draft && <button className="btn gold small" style={{ marginTop: 12 }} onClick={() => { setRecBody(email); setRecDraftId(null); setDraft(true); }}>Draft request email</button>}
              </div>
            )}
            {draft && (
              <>
                <label className="f" style={{ marginTop: 12 }}>Your message (click to edit)</label>
                <textarea className="draft" value={recBody} onChange={(e) => setRecBody(e.target.value)} />
                <div className="row end" style={{ flexWrap: "wrap" }}>
                  <button className="btn ghost small" onClick={() => setDraft(false)}>Cancel</button>
                  <button className="btn ghost small" disabled={!recBody.trim()} onClick={() => { const id = recDraftId || Date.now(); setRecDraftId(id); onSaveDraft({ id, kind: "Letter of rec request", refId: null, toName: best.name, about: opp ? opp.title : "", body: recBody, status: "draft" }); toast("Draft saved. Find it in the Drafts tab."); }}>Save draft</button>
                  <button className="btn gold small" disabled={!recBody.trim()} onClick={() => { const id = recDraftId || Date.now(); onSaveDraft({ id, kind: "Letter of rec request", refId: null, toName: best.name, about: opp ? opp.title : "", body: recBody, status: "sent" }); toast("✅ Request sent to " + best.name + " (mock)"); setDraft(false); }}>Yes, send request</button>
                </div>
              </>
            )}
          </div>
        </div>
        <div className="list">
          <div className="row" style={{ justifyContent: "space-between", flexWrap: "wrap" }}>
            <b>Your recommenders</b>
            <span className="row">
              <button className={"chip" + (showArch ? " on" : "")} onClick={() => setShowArch(!showArch)}>🗄 Archived ({people.filter((p) => p.archived).length})</button>
              <button className="btn gold small" onClick={() => setAdding(!adding)}>{adding ? "Close" : "＋ Add"}</button>
            </span>
          </div>
          {adding && (
            <div className="item">
              <label className="f">Name</label><input className="field" value={nf.name} onChange={(e) => setNf({ ...nf, name: e.target.value })} />
              <label className="f" style={{ marginTop: 10 }}>Role</label><input className="field" placeholder="e.g. Math instructor, CRC" value={nf.role} onChange={(e) => setNf({ ...nf, role: e.target.value })} />
              <label className="f" style={{ marginTop: 10 }}>Background (how they know you)</label><input className="field" value={nf.note} onChange={(e) => setNf({ ...nf, note: e.target.value })} />
              <label className="f" style={{ marginTop: 10 }}>Good for</label>
              <div className="skills">
                {["Internship", "Scholarship", "Fellowship"].map((t) => (
                  <button key={t} className={"chip" + (nf.tags.includes(t) ? " on" : "")} onClick={() => setNf({ ...nf, tags: nf.tags.includes(t) ? nf.tags.filter((x) => x !== t) : [...nf.tags, t] })}>{t}</button>
                ))}
              </div>
              <div className="row end"><button className="btn gold small" disabled={!nf.name.trim()} onClick={() => { setPeople([{ id: Date.now(), name: nf.name.trim(), role: nf.role, note: nf.note, tags: [...nf.tags, "Any"] }, ...people]); setNf({ name: "", role: "", note: "", tags: [] }); setAdding(false); toast("Saved " + nf.name.trim()); }}>Save recommender</button></div>
            </div>
          )}
          {shownPeople.length === 0 && <div className="card"><div className="empty">{showArch ? "No one archived." : "No recommenders saved."}</div></div>}
          {shownPeople.map((p) => (
            <div className="item" key={p.id}>
              <div className="person"><div className="avatar">{p.name[0]}</div>
                <div style={{ flex: 1 }}><b>{p.name}</b><div className="org">{p.role}</div><div style={{ fontSize: 13, marginTop: 6 }}>{p.note}</div>
                  <div style={{ marginTop: 10 }}><RowActions archived={!!p.archived} onArchive={() => { updP(p.id, { archived: true }); toast("Archived " + p.name); }} onRestore={() => updP(p.id, { archived: false })} onDelete={() => { setPeople(people.filter((x) => x.id !== p.id)); toast("🗑️ Deleted " + p.name); }} /></div>
                </div></div>
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

/* ---------- find internships (live listings from HireBase through the SacPath server) ---------- */
const SAMPLE_JOBS = [
  { id: "sample-1", title: "IT Support Intern", org: "Sample Company (demo data)", link: "https://www.example.com/it-intern", location: "Sacramento, CA", city: "Sacramento", remote: false, jobType: "Internship", pay: 22, posted: null },
  { id: "sample-2", title: "Junior Data Analyst Intern", org: "Sample Company (demo data)", link: "https://www.example.com/data-intern", location: "Remote", city: null, remote: true, jobType: "Internship", pay: 25, posted: null },
];
function FindJobs({ profile, prefs, items, onAdd, goResume }) {
  const [title, setTitle] = useState("Intern");
  const [skills, setSkills] = useState(profile ? profile.skills.filter((s) => SKILL_MAP[s] && !["leadership", "teamwork", "community", "writing"].includes(s)).slice(0, 3).join(", ") : "");
  const [city, setCity] = useState((prefs.places && prefs.places[0]) || "Sacramento");
  const [remote, setRemote] = useState(false);
  const [state, setState] = useState({ phase: "idle", jobs: [], error: "", cached: false, sample: false });
  const saved = new Set(items.map((i) => i.hbId).filter(Boolean));
  const split = (v) => v.split(",").map((x) => x.trim()).filter(Boolean);

  const search = async () => {
    setState({ phase: "loading", jobs: [], error: "", cached: false, sample: false });
    try {
      const r = await fetch("/api/jobs/search", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ titles: split(title), keywords: split(skills), remote, city: remote ? "" : city.trim(), limit: 15 }),
      });
      let data = null;
      try { data = await r.json(); } catch (e) { /* not JSON, so we are not talking to the SacPath server */ }
      if (!data) throw new Error("no-server");
      if (!r.ok) { setState({ phase: "error", jobs: [], error: data.error || "Search failed (" + r.status + ").", cached: false, sample: false }); return; }
      setState({ phase: "done", jobs: data.jobs || [], error: "", cached: !!data.cached, sample: false });
    } catch (e) {
      setState({ phase: "error", jobs: [], error: "no-server", cached: false, sample: false });
    }
  };

  return (
    <>
      <div className="top"><div><h2>Find internships</h2><p>Live listings from HireBase. Add the ones you like to your tracker.</p></div></div>
      {!profile && <div className="banner">👤 Add your resume in your profile and we will fill in your skills for you. <button className="link" onClick={goResume}>Go to profile →</button></div>}
      <div className="card" style={{ padding: 16, marginBottom: 14 }}>
        <div className="grid2">
          <div><label className="f">Job title</label><input className="field" placeholder="e.g. IT Intern, Data Analyst Intern" value={title} onChange={(e) => setTitle(e.target.value)} /></div>
          <div><label className="f">Skills (optional)</label><input className="field" placeholder="python, sql, networking" value={skills} onChange={(e) => setSkills(e.target.value)} /></div>
          <div><label className="f">City</label><input className="field" disabled={remote} value={city} onChange={(e) => setCity(e.target.value)} /></div>
          <div style={{ display: "flex", alignItems: "flex-end", gap: 10 }}>
            <button className={"chip" + (remote ? " on" : "")} onClick={() => setRemote(!remote)}>🏠 Remote only</button>
            <button className="btn gold" disabled={state.phase === "loading" || !title.trim()} onClick={search}>
              {state.phase === "loading" ? <><span className="spinner" /> Searching…</> : "🔎 Search"}
            </button>
          </div>
        </div>
      </div>

      {state.phase === "error" && (
        <div className="banner" style={{ background: "var(--red-soft)", color: "var(--red)" }}>
          {state.error === "no-server" ? (
            <>Can't reach the SacPath server, so live search is off. Run <b>npm start</b> and open <b>http://localhost:3000</b> (opening the file directly or a preview won't work). <button className="link" onClick={() => setState({ phase: "done", jobs: SAMPLE_JOBS, error: "", cached: false, sample: true })}>Show sample results instead</button></>
          ) : state.error}
        </div>
      )}
      {state.phase === "done" && state.sample && <div className="banner">These are made-up sample listings so you can try the page without the server. Real search needs the server running.</div>}
      {state.phase === "done" && !state.sample && <div className="banner ok">{state.jobs.length} listings from HireBase{state.cached ? " (saved from a search a few minutes ago)" : ""}. HireBase doesn't list application deadlines, so we set a check-in date 30 days out. You can change the status any time.</div>}

      {state.phase === "done" && (
        <div className="card">
          {state.jobs.length === 0 ? <div className="empty">No listings matched. Try a broader title like "Intern", fewer skills, or a nearby city.</div> : (
            <table>
              <thead><tr><th>Opportunity</th><th>Where</th><th>Pay</th><th></th></tr></thead>
              <tbody>
                {state.jobs.map((j) => (
                  <tr key={j.id}>
                    <td>
                      <div className="title">{j.title}</div>
                      <div className="org">{j.org}{j.jobType ? " · " + j.jobType : ""}{j.posted ? " · posted " + String(j.posted).slice(0, 10) : ""}</div>
                      {hasLink(j.link) && <a className="link" href={j.link} target="_blank" rel="noopener noreferrer">View posting ↗</a>}
                    </td>
                    <td><span className="tag">{j.remote ? "Remote" : j.location || "See posting"}</span></td>
                    <td>{j.pay != null ? "$" + j.pay + "/hr" : <span className="org">Not listed</span>}</td>
                    <td>{saved.has(j.id) ? <span className="org">✓ In tracker</span> : <button className="btn small" onClick={() => onAdd(j, skills)}>＋ Add to tracker</button>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}
      {state.phase === "idle" && <div className="card"><div className="empty">Pick a title and city, then press Search.</div></div>}
    </>
  );
}

function App() {
  const [tab, setTab] = useState("tracker");
  const [items, setItems] = useState(SEED);
  const [adding, setAdding] = useState(false);
  const [profile, setProfile] = useState(null);
  const [contacts, setContacts] = useState(AFFILIATES);
  const [recs, setRecs] = useState(PEOPLE);
  const [companies, setCompanies] = useState(COMPANIES);
  const [docs, setDocs] = useState(DOCS);
  const [drafts, setDrafts] = useState(DRAFTS);
  const upsertDraft = (d) => setDrafts((ds) => (ds.some((x) => x.id === d.id) ? ds.map((x) => (x.id === d.id ? { ...x, ...d, updated: iso(TODAY) } : x)) : [{ created: iso(TODAY), updated: iso(TODAY), ...d }, ...ds]));
  const [prefs, setPrefs] = useState(DEMO_PREFS);
  const [msg, setMsg] = useState("");
  const toast = (m) => { setMsg(m); setTimeout(() => setMsg(""), 2600); };
  const save = (d, saveCo) => {
    if (saveCo && !findCompany(companies, d.org)) setCompanies([{ id: Date.now() + 1, name: d.org, keys: [d.org.toLowerCase()], site: "", note: "" }, ...companies]);
    setItems([{ ...d, id: Date.now(), status: "Saved" }, ...items]); setAdding(false); toast("Saved! 5 reminders scheduled."); setTab("tracker"); };
  const addFound = (j, skillText) => {
    setItems((its) => [{
      id: Date.now(), hbId: j.id, title: j.title, org: j.org, type: "Internship", deadline: plus(30),
      location: j.location || "See posting", city: j.city || "", remote: !!j.remote, near: false, major: "Any",
      kw: detectSkills(j.title + " " + (skillText || "")), season: null, hours: null, pay: j.pay ?? null, lor: 0, essay: false,
      status: "Saved", source: "HireBase", link: j.link || "",
    }, ...its]);
    toast("Added to your tracker.");
  };
  const deleteOpp = (id) => {
    setItems((its) => its.filter((i) => i.id !== id));
    setContacts((cs) => cs.map((c) => ({ ...c, links: c.links.filter((l) => l !== id) })));
    toast("🗑️ Opportunity deleted.");
  };
  const NAV = [["tracker", "📋", "Tracker", items.filter((i) => !i.archived).length], ["find", "🔎", "Find internships", null], ["affiliates", "🤝", "Affiliates", contacts.filter((c) => !c.archived).length], ["companies", "🏢", "Companies", companies.filter((c) => !c.archived).length], ["resume", "👤", "Profile", null], ["reminders", "⏰", "Reminders", null], ["recs", "✉️", "Recommenders", recs.filter((r) => !r.archived).length], ["drafts", "📝", "Drafts", drafts.filter((d) => !d.archived && d.status === "draft").length]];

  return (
    <div className="app">
      <aside className="side">
        <div className="brand"><div className="brand-mark">S</div><h1>SacPath</h1></div>
        {NAV.map(([k, ic, l, c]) => (
          <button key={k} className={"nav" + (tab === k ? " on" : "")} onClick={() => setTab(k)}>
            <span>{ic}</span>{l}{c != null && <span className="count">{c}</span>}
          </button>
        ))}
        <div className="side-foot">No account or login needed. CRC Hacks 2026 prototype. Find internships uses live HireBase listings when the server is running; Smart Add is still simulated.</div>
      </aside>
      <main className="main">
        {tab === "tracker" && <Tracker items={items} setItems={setItems} openAdd={() => setAdding(true)} profile={profile} goResume={() => setTab("resume")} contacts={contacts} prefs={prefs} onDelete={deleteOpp} />}
        {tab === "find" && <FindJobs profile={profile} prefs={prefs} items={items} onAdd={addFound} goResume={() => setTab("resume")} />}
        {tab === "affiliates" && <Affiliates items={items} contacts={contacts} setContacts={setContacts} companies={companies} setCompanies={setCompanies} docs={docs} profile={profile} drafts={drafts} onSaveDraft={upsertDraft} toast={toast} />}
        {tab === "companies" && <Companies items={items} contacts={contacts} setContacts={setContacts} companies={companies} setCompanies={setCompanies} toast={toast} />}
        {tab === "resume" && <ResumeTab profile={profile} setProfile={setProfile} toast={toast} goTracker={() => setTab("tracker")} prefs={prefs} setPrefs={setPrefs} items={items.filter((i) => !i.archived)} docs={docs} setDocs={setDocs} />}
        {tab === "reminders" && <Reminders items={items} toast={toast} />}
        {tab === "recs" && <Recommenders items={items} people={recs} setPeople={setRecs} onSaveDraft={upsertDraft} toast={toast} />}
        {tab === "drafts" && <Drafts drafts={drafts} setDrafts={setDrafts} toast={toast} />}
      </main>
      {adding && <SmartAdd onClose={() => setAdding(false)} onSave={save} companies={companies} />}
      <Toast msg={msg} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
